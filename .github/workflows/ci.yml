name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate = `pnpm check`, minus dogfood browser tests: those require an
      # external fixture server that CI does not run. Uses the exact same
      # `test:ci` exclusion as the release gate so both stay in sync.
      - name: Gate
        run: |
          pnpm exec biome check .
          pnpm exec tsc -b
          pnpm test:ci
