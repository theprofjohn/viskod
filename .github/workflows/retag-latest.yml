name: retag-latest

on:
  workflow_dispatch:

# Temporary: repoints the npm `latest` dist-tag at the current alpha so the
# README's default install does not pull the deprecated 0.2.0-alpha. Removed
# after the run.
permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Point latest at current alpha
        run: npm dist-tag add "@viskod/cli@0.2.3-alpha" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
