name: release

on:
  push:
    tags:
      - 'v*'

# `contents: write` is scoped to the `release` job (GitHub release creation);
# publish and verify run with the minimum permissions for checkout/npm.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Human approval boundary: the `release` environment must be configured in
    # repository settings with at least one required reviewer before the first
    # public tag. A failed gate or missing approval prevents npm publication.
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        # pnpm is on PNPM_HOME, not in sudo's secure_path, so browser download
        # runs without sudo and apt deps use the proven `sudo npx` pattern.
        run: |
          pnpm exec playwright install chromium
          sudo npx playwright install-deps chromium
      # The tag that triggered this workflow must equal v<@viskod/cli version>;
      # any other tag is refused before anything is built or published.
      - name: Verify tag matches package version
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"
      # Deterministic release gate: Biome, tsc, CI-compatible tests, the
      # self-starting end-to-end workflow smoke, CLI bundling, and packed
      # artifact verification.
      - name: Release gate
        run: pnpm release:check
      - id: version
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      # Pack once, record the exact artifact, and publish that file — never a
      # second, unverified build. (`pnpm pack` rejects --filter; use --dir,
      # and an absolute destination: relative paths resolve against the
      # package dir, not the checkout root.)
      - name: Pack artifact for publication
        id: pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-artifact"
          pnpm --dir packages/cli pack --pack-destination "$GITHUB_WORKSPACE/dist-artifact"
          artifact="$(basename "$(ls "$GITHUB_WORKSPACE"/dist-artifact/*.tgz 2>/dev/null)" | tail -n1)"
          test -n "$artifact" || { echo "pack produced no tarball" >&2; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "Publishing artifact: $artifact (version ${{ steps.version.outputs.version }})"
      - name: Upload packed artifact
        uses: actions/upload-artifact@v7
        with:
          name: viskod-cli-tarball
          path: dist-artifact/*.tgz
          if-no-files-found: error
      - name: Publish to npm
        # Consumes the exact artifact produced and verified by the gate.
        # The ./ prefix matters: npm 11 parses a bare `dir/file.tgz` as a
        # GitHub shorthand spec (git ls-remote) instead of a local file.
        run: npm publish "./dist-artifact/${{ steps.pack.outputs.artifact }}" --tag "$TAG" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pre-release (e.g. 0.2.2-alpha) → `alpha` tag; stable → `latest`
          TAG: ${{ contains(steps.version.outputs.version, '-') && 'alpha' || 'latest' }}

  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install published CLI (postinstall downloads Chromium)
        run: npm install -g @viskod/cli@${{ needs.publish.outputs.version }}
      - name: Install Chromium system deps
        run: sudo npx playwright install-deps chromium
      - name: Installed executable reports expected version
        run: |
          reported="$(viskod --version)"
          expected="${{ needs.publish.outputs.version }}"
          echo "reported: $reported"
          case "$reported" in
            *"$expected"*) ;;
            *) echo "version mismatch: expected $expected in '$reported'" >&2; exit 1 ;;
          esac
      - name: Health check (no repo, no tsx)
        run: viskod health
      - name: MCP tools/list probe through published binary
        # No --url on purpose: a live browser child would inherit stdout and
        # keep the probe's pipe open after timeout kills the server. tools/list
        # needs no browser.
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n' \
            | timeout 30 viskod serve 2>/dev/null \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const l=d.trim().split('\n').map(JSON.parse);if(l.length!==2)process.exit(1);const tools=l[1].result.tools.map(t=>t.name);if(!tools.includes('viskod_capture_context')||!tools.includes('recapture_visual_review'))process.exit(1);console.log('MCP OK:',tools.length,'tools')})"

  release:
    # A GitHub release is created only after both publication and
    # post-publish verification succeed.
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download packed artifact
        uses: actions/download-artifact@v8
        with:
          name: viskod-cli-tarball
          path: dist-artifact
      - name: Compute artifact checksum
        id: checksum
        run: |
          artifact="${{ needs.publish.outputs.artifact }}"
          sha256sum "dist-artifact/$artifact" | awk '{print $1}' > checksum.txt
          echo "sha256=$(cat checksum.txt)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        run: |
          version="${{ needs.publish.outputs.version }}"
          tag="$GITHUB_REF_NAME"
          commit="$GITHUB_SHA"
          dist_tag="${{ contains(needs.publish.outputs.version, '-') && 'alpha' || 'latest' }}"
          artifact="${{ needs.publish.outputs.artifact }}"
          checksum="${{ steps.checksum.outputs.sha256 }}"
          notes="$(printf '## Release metadata\n- Tag: %s\n- Commit: %s\n- Package: @viskod/cli@%s\n- npm dist-tag: %s\n- Artifact: %s\n- SHA-256: %s' "$tag" "$commit" "$version" "$dist_tag" "$artifact" "$checksum")"
          gh release create "$tag" "dist-artifact/$artifact" --title "$tag" --notes "$notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
