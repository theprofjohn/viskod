name: prove-artifact-actions

on:
  workflow_dispatch:

# Temporary: proves upload-artifact@v7 / download-artifact@v8 round-trip
# exactly as release.yml uses them (name/path/if-no-files-found + sha256sum).
# Removed after a green run.
permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pack a probe artifact
        run: |
          mkdir -p dist-artifact
          printf 'probe' > dist-artifact/probe.tgz
      - name: Upload packed artifact
        uses: actions/upload-artifact@v7
        with:
          name: viskod-cli-tarball
          path: dist-artifact/*.tgz
          if-no-files-found: error
      - name: Compute artifact checksum
        id: checksum
        run: |
          artifact="probe.tgz"
          sha256sum "dist-artifact/$artifact" | awk '{print $1}' > checksum.txt
          echo "sha256=$(cat checksum.txt)" >> "$GITHUB_OUTPUT"
          echo "checksum=${{ steps.checksum.outputs.sha256 }}"
      - name: Download packed artifact
        uses: actions/download-artifact@v8
        with:
          name: viskod-cli-tarball
          path: dist-artifact
      - name: Verify round-trip
        run: |
          test -f dist-artifact/probe.tgz
          test "$(cat dist-artifact/probe.tgz)" = "probe"
          echo "round-trip OK"
